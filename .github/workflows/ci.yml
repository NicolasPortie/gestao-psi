name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build backend/Psique.slnx --nologo
      - run: dotnet test backend/Psique.Api.Tests/Psique.Api.Tests.csproj --no-build --nologo
      - name: Validar migracoes EF (script idempotente)
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.9
          dotnet ef migrations script --idempotent \
            --project backend/Psique.Api/Psique.Api.csproj \
            --output /tmp/migracoes.sql
          test -s /tmp/migracoes.sql
          dotnet ef migrations has-pending-model-changes \
            --project backend/Psique.Api/Psique.Api.csproj --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run contraste
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
