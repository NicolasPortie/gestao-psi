<app-layout-autenticacao>
  <header class="mb-9"><img class="h-12 w-fit" src="/assets/gestaopsi-marca.png" alt="GestaoPsi" /><h1 class="mt-6 text-[27px] font-semibold text-[#181c21]">Defina uma nova senha</h1><p class="mt-2 text-sm leading-6 text-[#43474f]">Escolha uma senha forte para proteger o acesso ao seu consultorio.</p></header>
  @if (concluido()) { <p class="rounded-lg border border-[#abcfb2] bg-[#eef8f0] p-4 text-sm text-[#2d4e37]" role="status">Senha atualizada. Redirecionando para o login.</p> } @else { <form class="flex flex-col gap-5" [formGroup]="formulario" (ngSubmit)="salvar()" novalidate><label class="flex flex-col gap-2 text-sm font-semibold text-[#43474f]">Nova senha<input class="h-12 rounded-lg border border-[#c3c6d1] bg-[#f1f4fb] px-3 text-base" type="password" autocomplete="new-password" formControlName="senha" /></label><label class="flex flex-col gap-2 text-sm font-semibold text-[#43474f]">Confirmar senha<input class="h-12 rounded-lg border border-[#c3c6d1] bg-[#f1f4fb] px-3 text-base" type="password" autocomplete="new-password" formControlName="confirmacao" /></label>@if (erro()) { <p class="text-sm text-[#ba1a1a]" role="alert">{{ erro() }}</p> }<button pButton class="h-12 !border-0 !bg-[#44664e] !text-white" type="submit" [disabled]="enviando()">{{ enviando() ? 'Salvando...' : 'Redefinir senha' }}</button><a class="text-center text-sm font-semibold text-[#44664e] hover:underline" routerLink="/login">Voltar ao login</a></form> }
</app-layout-autenticacao>
