<app-shell
  [nomeUsuario]="usuario()?.nomeCompleto ?? 'GestaoPsi'"
  [perfil]="usuario()?.perfil ?? 'Conta autenticada'"
  [notificacoesNaoLidas]="0"
>
  <section class="min-h-[calc(100dvh-8rem)] rounded-2xl border border-[#eae1d9]/80 bg-[#fdfbf7] p-6 sm:p-8 lg:p-10">
    <div class="w-full">
      <a
        class="inline-flex items-center gap-2 text-sm font-bold text-[#44664e] hover:text-[#2d4e37]"
        routerLink="/painel"
      >
        <i class="pi pi-arrow-left text-xs" aria-hidden="true"></i>
        Voltar ao painel
      </a>

      <div class="mt-8 rounded-2xl border border-[#eae1d9] bg-white p-6 sm:p-8 lg:p-10">
        <div class="grid gap-6 lg:grid-cols-[auto_minmax(0,1fr)_minmax(18rem,0.32fr)] lg:items-start">
          <span
            class="flex size-12 flex-none items-center justify-center rounded-xl bg-[#44664e] text-[#fbf7f1]"
          >
            <i class="pi text-lg" [ngClass]="data().icone" aria-hidden="true"></i>
          </span>

          <div class="min-w-0">
            <p class="text-xs font-bold uppercase tracking-[0.18em] text-[#44664e]">
              {{ data().etiqueta }}
            </p>
            <h1 class="mt-2 text-2xl font-bold tracking-tight text-[#1f1b16]">
              {{ data().titulo }}
            </h1>
            <p class="mt-3 max-w-2xl text-sm leading-6 text-[#5a554f]">
              Esta funcionalidade ainda nao esta disponivel. Ela aparecera aqui assim
              que estiver pronta para uso.
            </p>

            <a
              class="mt-6 inline-flex h-10 items-center justify-center gap-2 rounded-lg bg-[#44664e] px-4 text-sm font-bold text-[#fbf7f1] transition-colors hover:bg-[#52765c]"
              routerLink="/painel"
            >
              Voltar ao painel
              <i class="pi pi-arrow-right text-xs" aria-hidden="true"></i>
            </a>
          </div>
          <div class="rounded-xl border border-[#eae1d9] bg-[#fcfaf7] p-5 text-sm leading-6 text-[#5a554f]">
            <p class="font-bold text-[#1f1b16]">Em preparação</p>
            <p class="mt-2">Este módulo será liberado quando o fluxo operacional estiver completo e validado.</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</app-shell>
