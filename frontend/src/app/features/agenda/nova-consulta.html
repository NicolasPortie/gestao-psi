<app-shell [nomeUsuario]="usuario()?.usuario?.nomeCompleto ?? 'GestaoPsi'" [perfil]="usuario()?.usuario?.perfil ?? ''"><section class="mx-auto w-full max-w-2xl"><a class="text-sm font-bold text-[#44664e] hover:underline" routerLink="/agenda">← Voltar para agenda</a><form class="mt-6 rounded-2xl border border-[#eae1d9] bg-white p-6" [formGroup]="form" (ngSubmit)="salvar()"><h1 class="text-2xl font-bold text-[#1f1b16]">Nova consulta</h1><p class="mt-2 text-sm text-[#5a554f]">Selecione o paciente, tipo e horario do atendimento.</p><div class="mt-6 grid gap-4"><label class="flex flex-col gap-2 text-sm font-bold">Paciente<select class="h-11 rounded-lg border border-[#d8cdc3] bg-white px-3" formControlName="pacienteId"><option value="">Selecione</option>@for (paciente of pacientes(); track paciente.id) { <option [value]="paciente.id">{{ paciente.nomeCompleto }}</option> }</select></label><label class="flex flex-col gap-2 text-sm font-bold">Tipo de atendimento<select class="h-11 rounded-lg border border-[#d8cdc3] bg-white px-3" formControlName="tipoAtendimentoId"><option value="">Selecione</option>@for (tipo of tipos(); track tipo.id) { <option [value]="tipo.id">{{ tipo.nome }} · {{ tipo.duracaoMinutos }} min</option> }</select></label><div class="grid gap-4 sm:grid-cols-2"><label class="flex flex-col gap-2 text-sm font-bold">Inicio<input class="h-11 rounded-lg border border-[#d8cdc3] px-3" type="datetime-local" formControlName="inicio" /></label><label class="flex flex-col gap-2 text-sm font-bold">Fim<input class="h-11 rounded-lg border border-[#d8cdc3] px-3" type="datetime-local" formControlName="fim" /></label></div><label class="flex flex-col gap-2 text-sm font-bold">Modalidade<select class="h-11 rounded-lg border border-[#d8cdc3] bg-white px-3" formControlName="modalidade"><option>Presencial</option><option>Online</option><option>Hibrido</option></select></label>@if (erro()) { <p class="text-sm text-[#ba1a1a]" role="alert">{{ erro() }}</p> }<button class="h-11 rounded-lg bg-[#44664e] text-sm font-bold text-white disabled:opacity-60" [disabled]="salvando()" type="submit">{{ salvando() ? 'Salvando...' : 'Criar consulta' }}</button></div></form></section></app-shell>
