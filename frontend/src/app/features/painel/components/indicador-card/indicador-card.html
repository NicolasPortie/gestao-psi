<article class="flex items-center gap-4">
  <div
    class="flex size-12 items-center justify-center rounded-2xl"
    [class.bg-[#c6eccd]/40]="tom === 'principal'"
    [class.text-[#44664e]]="tom === 'principal'"
    [class.bg-[#ffdad6]/45]="tom === 'erro'"
    [class.text-[#ba1a1a]]="tom === 'erro'"
    [class.bg-[#eae1d9]/45]="tom === 'neutro'"
    [class.text-[#5a554f]]="tom === 'neutro'"
  >
    <i class="pi text-lg" [class]="icone" aria-hidden="true"></i>
  </div>
  <div class="min-w-0">
    <p class="text-2xl font-bold leading-tight text-[#1f1b16]">{{ valor }}</p>
    <p
      class="text-[11px] font-bold uppercase tracking-wide"
      [class.text-[#44664e]]="tom === 'principal'"
      [class.text-[#ba1a1a]]="tom === 'erro'"
      [class.text-[#5a554f]]="tom === 'neutro'"
    >
      {{ rotulo }}
    </p>
  </div>
</article>
