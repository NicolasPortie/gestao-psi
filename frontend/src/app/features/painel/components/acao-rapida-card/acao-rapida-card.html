@if (acao.habilitada) {
  <a
    class="group flex min-h-24 flex-col justify-between rounded-xl border border-[#eae1d9]/70 bg-[#fcfaf7] p-3 text-left transition-colors hover:border-[#44664e]/25 hover:bg-[#f1f4fb]"
    [routerLink]="acao.rota"
    >
    <span class="flex items-center justify-between gap-3">
      <i class="pi text-base text-[#44664e]" [ngClass]="acao.icone" aria-hidden="true"></i>
      <i class="pi pi-arrow-up-right text-xs text-[#5a554f]/45 group-hover:text-[#44664e]"></i>
    </span>
    <span>
      <span class="block text-sm font-bold text-[#1f1b16]">{{ acao.titulo }}</span>
      <span class="mt-1 block text-xs leading-5 text-[#5a554f]">{{ acao.descricao }}</span>
    </span>
  </a>
} @else {
  <div
    class="flex min-h-24 flex-col justify-between rounded-xl border border-dashed border-[#eae1d9] bg-[#f1f4fb]/35 p-3 text-left text-[#5a554f]/55"
    aria-disabled="true"
  >
    <i class="pi text-base" [ngClass]="acao.icone" aria-hidden="true"></i>
    <span>
      <span class="block text-sm font-bold">{{ acao.titulo }}</span>
      <span class="mt-1 block text-xs leading-5">{{ acao.descricao }}</span>
    </span>
  </div>
}
