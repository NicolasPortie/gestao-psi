<article
  class="group flex items-center gap-4 rounded-2xl p-4 transition-colors hover:bg-[#f1f4fb]/80"
  [class.bg-[#44664e]/5]="consulta.status === 'Confirmada'"
  [class.ring-1]="consulta.status === 'Confirmada'"
  [class.ring-[#44664e]/20]="consulta.status === 'Confirmada'"
>
  <div class="min-w-[60px] text-center">
    <p class="text-xl font-bold text-[#44664e]">{{ consulta.horarioInicio }}</p>
    <p class="text-[10px] font-bold uppercase text-[#5a554f]/60">
      {{ consulta.duracaoMinutos }} min
    </p>
  </div>

  <div
    class="h-10 w-1 rounded-full bg-[#eae1d9] transition-colors group-hover:bg-[#44664e]/50"
  ></div>

  <div class="min-w-0 flex-1">
    <h3 class="truncate text-sm font-bold text-[#1f1b16] sm:text-base">
      {{ consulta.paciente }}
    </h3>
    <p class="truncate text-xs text-[#5a554f]">
      {{ consulta.tipoAtendimento }} - {{ consulta.modalidade }}
    </p>
  </div>

  <span
    class="hidden rounded-full px-2.5 py-1 text-[10px] font-bold uppercase sm:inline-flex"
    [ngClass]="obterClasseStatus(consulta.status)"
  >
    {{ consulta.status }}
  </span>

  <a
    class="flex size-8 items-center justify-center rounded-full text-[#5a554f]/60 transition-colors hover:bg-white hover:text-[#44664e]"
    [routerLink]="['/consultas', consulta.id]"
    aria-label="Abrir consulta"
  >
    <i class="pi pi-ellipsis-h text-sm" aria-hidden="true"></i>
  </a>
</article>
