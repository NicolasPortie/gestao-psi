<div class="min-h-dvh bg-[#f6f7f4] text-[#20241f]">
  <a
    class="fixed left-4 top-0 z-50 -translate-y-full rounded-b-lg bg-[#1f1b16] px-4 py-2 text-sm font-bold text-white transition-transform focus:translate-y-0"
    href="#conteudo-principal"
  >
    Ir para o conteúdo
  </a>
  <header
    class="sticky top-0 z-30 border-b border-[#dfe5dd] bg-white/95 shadow-[0_1px_0_rgba(32,36,31,0.04)] backdrop-blur-xl"
  >
    <div
      class="mx-auto flex h-16 w-full max-w-[1800px] items-center justify-between gap-4 px-4 sm:px-6 lg:px-8"
    >
      <div class="flex min-w-0 items-center gap-6">
        <a class="flex items-center gap-2" routerLink="/painel" aria-label="GestaoPsi">
          <span class="text-lg font-semibold tracking-[-0.03em] text-[#36563f]">GestaoPsi</span>
        </a>

        <nav class="hidden items-center gap-1 lg:flex" aria-label="Menu principal">
          <a
            class="inline-flex h-10 items-center gap-2 rounded-lg px-3 text-sm font-medium text-[#5a554f] transition-colors hover:bg-[#eef4ef] hover:text-[#36563f]"
            routerLink="/painel"
            routerLinkActive="!bg-[#eef4ef] !text-[#44664e]"
            ariaCurrentWhenActive="page"
          >
            <i class="pi pi-home text-sm" aria-hidden="true"></i>
            Painel
          </a>
          <a
            class="inline-flex h-10 items-center gap-2 rounded-lg px-3 text-sm font-medium text-[#5a554f] transition-colors hover:bg-[#eef4ef] hover:text-[#36563f]"
            routerLink="/agenda"
            routerLinkActive="!bg-[#eef4ef] !text-[#44664e]"
            ariaCurrentWhenActive="page"
          >
            <i class="pi pi-calendar text-sm" aria-hidden="true"></i>
            Agenda
          </a>
          <a
            class="inline-flex h-10 items-center gap-2 rounded-lg px-3 text-sm font-medium text-[#5a554f] transition-colors hover:bg-[#eef4ef] hover:text-[#36563f]"
            routerLink="/pacientes"
            routerLinkActive="!bg-[#eef4ef] !text-[#44664e]"
            ariaCurrentWhenActive="page"
          >
            <i class="pi pi-users text-sm" aria-hidden="true"></i>
            Pacientes
          </a>
          <a
            class="inline-flex h-10 items-center gap-2 rounded-lg px-3 text-sm font-medium text-[#5a554f] transition-colors hover:bg-[#eef4ef] hover:text-[#36563f]"
            routerLink="/pagamentos"
            routerLinkActive="!bg-[#eef4ef] !text-[#44664e]"
            ariaCurrentWhenActive="page"
          >
            <i class="pi pi-wallet text-sm" aria-hidden="true"></i>
            Financeiro
          </a>
          <a
            class="inline-flex h-10 items-center gap-2 rounded-lg px-3 text-sm font-medium text-[#5a554f] transition-colors hover:bg-[#eef4ef] hover:text-[#36563f]"
            routerLink="/lista-espera"
            routerLinkActive="!bg-[#eef4ef] !text-[#44664e]"
            ariaCurrentWhenActive="page"
          >
            <i class="pi pi-clock text-sm" aria-hidden="true"></i>
            Lista de espera
          </a>
          <a
            class="inline-flex h-10 items-center gap-2 rounded-lg px-3 text-sm font-medium text-[#5a554f] transition-colors hover:bg-[#eef4ef] hover:text-[#36563f]"
            routerLink="/configuracoes/agenda"
            routerLinkActive="!bg-[#eef4ef] !text-[#44664e]"
            ariaCurrentWhenActive="page"
          >
            <i class="pi pi-cog text-sm" aria-hidden="true"></i>
            Configurações
          </a>
        </nav>
      </div>

      <div class="flex items-center gap-3">
        <a
          class="relative flex size-9 items-center justify-center rounded-full text-[#5a554f] transition-colors hover:bg-[#eef4ef] hover:text-[#36563f]"
          routerLink="/notificacoes"
          aria-label="Notificações"
        >
          <i class="pi pi-bell text-sm" aria-hidden="true"></i>
          @if (notificacoesNaoLidas > 0) {
            <span
              class="absolute right-1 top-1 size-2 rounded-full bg-[#ba1a1a]"
              aria-hidden="true"
            ></span>
          }
        </a>

        <div class="hidden text-right sm:block">
          <p class="max-w-44 truncate text-xs font-bold leading-none text-[#1f1b16]">
            {{ nomeUsuario }}
          </p>
          <p class="mt-1 text-[10px] font-medium text-[#5a554f]">{{ perfil }}</p>
        </div>

        <button
          class="flex size-9 items-center justify-center rounded-full bg-[#f1f4fb] text-[#44664e] transition-colors hover:bg-[#c6eccd]/50"
          type="button"
          (click)="sair()"
          aria-label="Sair"
        >
          <i class="pi pi-sign-out text-sm" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <nav
      class="mx-auto grid h-12 w-full max-w-[1800px] grid-cols-5 items-center gap-1 px-2 lg:hidden"
      aria-label="Menu principal mobile"
    >
      <a
        class="inline-flex h-9 min-w-0 items-center justify-center gap-1 rounded-lg px-1 text-xs font-semibold text-[#5a554f]"
        routerLink="/painel"
        routerLinkActive="!bg-[#eef4ef] !text-[#44664e]"
        ariaCurrentWhenActive="page"
      >
        <i class="pi pi-home text-sm" aria-hidden="true"></i>
        <span class="truncate">Painel</span>
      </a>
      <a
        class="inline-flex h-9 min-w-0 items-center justify-center gap-1 rounded-lg px-1 text-xs font-semibold text-[#5a554f]"
        routerLink="/pacientes"
        routerLinkActive="!bg-[#eef4ef] !text-[#44664e]"
        ariaCurrentWhenActive="page"
      >
        <i class="pi pi-users text-sm" aria-hidden="true"></i>
        <span class="truncate">Pacientes</span>
      </a>
      <a
        class="inline-flex h-9 min-w-0 items-center justify-center gap-1 rounded-lg px-1 text-xs font-semibold text-[#5a554f]"
        routerLink="/agenda"
        routerLinkActive="!bg-[#eef4ef] !text-[#44664e]"
        ariaCurrentWhenActive="page"
      >
        <i class="pi pi-calendar text-sm" aria-hidden="true"></i>
        <span class="truncate">Agenda</span>
      </a>
      <a
        class="inline-flex h-9 min-w-0 items-center justify-center gap-1 rounded-lg px-1 text-xs font-semibold text-[#5a554f]"
        routerLink="/pagamentos"
        routerLinkActive="!bg-[#eef4ef] !text-[#44664e]"
        ariaCurrentWhenActive="page"
      >
        <i class="pi pi-wallet text-sm" aria-hidden="true"></i>
        <span class="truncate">Financeiro</span>
      </a>
      <a
        class="inline-flex h-9 min-w-0 items-center justify-center gap-1 rounded-lg px-1 text-xs font-semibold text-[#5a554f]"
        routerLink="/configuracoes/agenda"
        routerLinkActive="!bg-[#eef4ef] !text-[#44664e]"
        ariaCurrentWhenActive="page"
        aria-label="Configurações da agenda"
      >
        <i class="pi pi-cog text-sm" aria-hidden="true"></i>
        <span class="truncate">Ajustes</span>
      </a>
    </nav>
  </header>

  <main
    id="conteudo-principal"
    tabindex="-1"
    class="conteudo-pagina mx-auto flex w-full max-w-[1800px] flex-col gap-6 p-4 sm:p-6 lg:p-8"
  >
    <ng-content />
  </main>
</div>
