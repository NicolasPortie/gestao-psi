<main class="flex min-h-dvh overflow-hidden bg-[#f8f9ff]">
  <section
    class="relative hidden min-w-0 flex-1 overflow-hidden bg-[#ebeef5] lg:block"
    aria-label="Consultório acolhedor"
  >
    <img
      class="absolute inset-0 size-full object-cover object-center"
      src="/assets/login-consultorio-gestaopsi.png"
      alt="Consultório de psicologia iluminado, com poltrona e mesa de atendimento"
    />
    <div
      class="pointer-events-none absolute inset-0 bg-[#44664e]/10 mix-blend-multiply"
      aria-hidden="true"
    ></div>

    @if (destaqueTitulo) {
      <div
        class="absolute top-1/2 left-1/2 w-[min(520px,72%)] -translate-x-1/2 -translate-y-1/2 rounded-xl border border-white/30 bg-white/55 p-10 shadow-[0_4px_20px_rgba(0,0,0,0.04)] backdrop-blur-md"
      >
        <h2 class="mb-3 text-2xl leading-8 font-semibold text-[#30568b]">
          {{ destaqueTitulo }}
        </h2>
        <p class="text-base leading-6 text-[#43474f]">
          {{ destaqueDescricao }}
        </p>
      </div>
    }
  </section>

  <section
    class="relative z-10 flex min-h-dvh w-full min-w-0 flex-col overflow-y-auto bg-white shadow-[-14px_0_40px_rgba(45,49,54,0.08)] lg:flex-none"
    [class.lg:w-[480px]]="!painelAmplo"
    [class.lg:w-[560px]]="painelAmplo"
  >
    <div
      class="flex flex-1 items-start justify-center px-5 py-10 sm:items-center sm:px-8 sm:py-14 lg:px-12"
    >
      <div
        class="w-full max-w-[420px] [animation:entrada_.5s_ease-out_both] motion-reduce:animate-none"
      >
        <ng-content />
      </div>
    </div>

    <footer
      class="flex flex-col items-center gap-3 border-t border-[#c3c6d1]/20 px-5 py-5 text-center text-[11px] leading-[14px] font-medium text-[#43474f] lg:px-12 lg:py-6"
    >
      <p>© 2026 GestãoPsi - Gestão Humanizada para Psicólogos</p>
      <nav
        class="flex justify-center gap-[18px] lg:gap-6"
        aria-label="Links institucionais"
      >
        <a class="transition-colors hover:text-[#44664e]" href="#suporte">Suporte</a>
        <a class="transition-colors hover:text-[#44664e]" href="#privacidade">
          Privacidade
        </a>
        <a class="transition-colors hover:text-[#44664e]" href="#termos">
          Termos de Uso
        </a>
      </nav>
    </footer>
  </section>
</main>
