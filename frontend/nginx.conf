server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabecalhos de seguranca. A CSP proibe scripts embutidos e conexoes a terceiros: a SPA so fala com a propria origem.
  # style-src precisa de 'unsafe-inline' porque React, Base UI e Sonner aplicam estilos por atributo.
  # Em producao com TLS, acrescente Strict-Transport-Security no terminador HTTPS.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # API do GestaoPsi (nome do servico no compose)
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A API ja envia estes tres; evita o cabecalho duplicado (o add_header do servidor tambem os aplica).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
  }

  # Arquivos com hash no nome nunca mudam: cache longo. `expires` nao zera os add_header herdados.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Fotos do produto (login): sem hash no nome, entao cache curto para trocas aparecerem em um dia.
  location /imagens/ {
    expires 1d;
    try_files $uri =404;
  }

  # O HTML e o script de tema nao tem hash: sempre revalidar para pegar a versao nova apos um deploy.
  location = /index.html {
    expires -1;
  }
  location = /tema-inicial.js {
    expires -1;
  }

  # SPA React: fallback para index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
